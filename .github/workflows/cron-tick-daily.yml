name: cron-tick (daily TTL purges)

# v2.1 PR-D39 — daily slice of the Free-tier pg_cron substitute.
# See cron-tick-hourly.yml for the design rationale.
#
# `?slot=daily` runs the TTL purges (PR #252):
#   * old notifications
#   * old content reports
#   * old device-integrity checks
#   * old virtual-call sessions
#
# 03:00 UTC = 08:30 IST — picked to land before working hours so any
# incidental table-lock churn doesn't hit live traffic.
#
# Required repo secrets:
#   CRON_TICK_SECRET — same value as Supabase's CRON_TICK_SECRET
#   SUPABASE_ANON_KEY — passed as `Authorization: Bearer` to satisfy
#                       the Supabase gateway's JWT-required default.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: cron-tick-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout response summarizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: POST cron-tick ?slot=daily
        env:
          CRON_TICK_SECRET: ${{ secrets.CRON_TICK_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_TICK_SECRET}" ]; then
            echo "::error::CRON_TICK_SECRET not configured. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_ANON_KEY not configured. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          URL="https://eyswaywvtartpvtoxtdr.supabase.co/functions/v1/cron-tick?slot=daily"
          umask 077
          RESPONSE_BODY="$(mktemp "${RUNNER_TEMP}/cron-daily-response.XXXXXX")"
          trap 'rm -f -- "${RESPONSE_BODY}"' EXIT
          CURL_EXIT=0
          # The only captured stdout is the numeric HTTP status. Raw response
          # content and curl errors must never reach Actions logs or summaries.
          HTTP_STATUS="$(curl --fail-with-body \
               --silent \
               --max-time 120 \
               --output "${RESPONSE_BODY}" \
               --write-out '%{http_code}' \
               -X POST "$URL" \
               -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
               -H "X-Cron-Secret: ${CRON_TICK_SECRET}" \
               -H "Content-Type: application/json" \
               -d '{}' 2>/dev/null)" || CURL_EXIT=$?
          SUMMARY_EXIT=0
          python3 scripts/cron_response_summary.py \
            --body "${RESPONSE_BODY}" \
            --http-status "${HTTP_STATUS}" \
            --curl-exit-code "${CURL_EXIT}" \
            --summary "${GITHUB_STEP_SUMMARY}" || SUMMARY_EXIT=$?
          # Reporting cannot erase the actual transport failure. A malformed
          # HTTP200 body also fails closed; missing/failed persistence only warns.
          if [ "${CURL_EXIT}" -ne 0 ]; then
            exit "${CURL_EXIT}"
          fi
          exit "${SUMMARY_EXIT}"
