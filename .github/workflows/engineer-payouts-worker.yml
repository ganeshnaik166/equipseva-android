name: engineer-payouts-worker (every 5 min)

# Round 424 — drains the engineer_payouts queue by POSTing to
# `process-engineer-payouts` edge fn. The fn pulls queued rows, calls
# the configured payout provider, and writes the result back. Webhook
# `payouts-webhook` (separate URL configured in the provider's
# dashboard) flips the row to processed when the money lands.
#
# Round 432 — provider switched from RazorpayX to Cashfree Payouts
# after RazorpayX hard-rejected sole proprietorships. CASHFREE_*
# env vars replace the old RAZORPAYX_* ones on the Supabase side.
#
# Safe to run before the provider is activated: the edge fn detects
# missing CASHFREE_* env vars and returns {ok:true, configured:false,
# processed:0} without touching anything.
#
# Required repo secrets:
#   CRON_TICK_SECRET — shared secret matching the Supabase env var of
#                      the same name. Auths the worker the same way
#                      cron-tick-hourly does.
#   SUPABASE_ANON_KEY — passed as `Authorization: Bearer` to satisfy
#                       the Supabase gateway's JWT-required default.
#                       The function-level X-Cron-Secret check is the
#                       real auth gate; this header just gets us past
#                       the gateway. Anon key is already public (it's
#                       embedded in the Android APK).

on:
  schedule:
    # Every 5 minutes. RazorpayX UPI payouts settle in seconds; the
    # tick interval just sets the upper bound on "engineer added their
    # VPA but the previous queued row was still NULL-method-id" lag.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: engineer-payouts-worker
  cancel-in-progress: false

# round3809 — the "Alert on cron failure" canary below had NEVER once
# fired despite ~13 days of consecutive scheduled failures: this workflow
# had no `permissions:` block, the repo default token is read-only, and
# issues.create therefore failed — the canary itself errored on every run.
# A watchdog that cannot bark is worse than none: it reads as "no issue
# filed, so nothing is wrong". NOTE: scheduled runs execute the copy of
# this file on the DEFAULT branch, so this grant takes effect only when
# merged to main.
permissions:
  contents: read
  issues: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: POST process-engineer-payouts
        id: tick
        env:
          CRON_TICK_SECRET: ${{ secrets.CRON_TICK_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_TICK_SECRET}" ]; then
            echo "::error::CRON_TICK_SECRET not configured."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_ANON_KEY not configured."
            exit 1
          fi
          URL="https://eyswaywvtartpvtoxtdr.supabase.co/functions/v1/process-engineer-payouts?limit=25"
          curl --fail-with-body \
               --silent --show-error \
               --max-time 120 \
               -X POST "$URL" \
               -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
               -H "X-Cron-Secret: ${CRON_TICK_SECRET}" \
               -H "Content-Type: application/json" \
               -d '{}'

      # Round 466 — open / update a single sticky GitHub Issue when the
      # payout worker fails. Memory: gateway 401 silently killed cron
      # for weeks before founder noticed. This step is the canary.
      # Only fires on cron-driven failures (manual workflow_dispatch
      # runs are excluded so a deliberate test doesn't spam issues).
      - name: Alert on cron failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Engineer payouts worker is FAILING';
            const body = [
              `Latest scheduled run failed: ${context.runId}`,
              `Run URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Time: ${new Date().toISOString()}`,
              '',
              'This is auto-posted by .github/workflows/engineer-payouts-worker.yml on a cron-driven failure.',
              'Likely causes: rotated CRON_TICK_SECRET or SUPABASE_ANON_KEY, function unpublished, Cashfree outage propagating as 5xx the edge fn now retries (so it should self-heal).',
              'Close this issue manually after fixing — next failure will re-open.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'payouts-cron-down',
              per_page: 5,
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['payouts-cron-down', 'bug', 'priority-critical'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Another failure at ${new Date().toISOString()} — run ${context.runId}`,
              });
            }
