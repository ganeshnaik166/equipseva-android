name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    # Round 3768 — was `[main]` only; see android.yml's same-day fix for
    # why (main is frozen, all real work happens on ops/* branches via
    # direct push, so this had never once run on the active branch).
    branches: [main, "ops/**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

# Cancel in-flight runs for the same branch when a new commit arrives —
# the Web Console is a single-purpose app, no point burning CI minutes
# on stale commits.
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (with placeholder env vars)
        env:
          # Build needs NEXT_PUBLIC_* to compile but they're not used
          # for the static analysis pass. Use placeholders so the build
          # doesn't fail when GitHub Secrets aren't configured. The
          # production deploy pipeline (Vercel) injects real values.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_FOUNDER_EMAIL: placeholder@example.com
        run: npm run build
