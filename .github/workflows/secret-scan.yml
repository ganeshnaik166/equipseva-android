name: secret-scan

on:
  pull_request:
  push:
    # Round 3768 — was `[main]` only; see android.yml's same-day fix.
    # Secret scanning had never once run on the active ops/* branch's
    # pushes (months of commits, zero automated secret-leak coverage
    # via this workflow — GitHub's own repo-level scanning, if enabled,
    # is a separate, independent mechanism this doesn't affect either
    # way).
    branches: [main, "ops/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan prior commits on PRs.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job on any finding. No license required for public repos;
          # if this repo becomes private, set GITLEAKS_LICENSE in repo secrets.
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
