name: secret-scan

on:
  pull_request:
  push:
    # Scan helper and integration branches before they reach main.
    branches: [main, "ops/**", "codex/**", "claudedev-**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Scan the event head, not GitHub's synthetic PR merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz' \
            --output "$install_dir/gitleaks.tar.gz"
          # SHA256 from the official v8.24.3 checksums release asset.
          printf '%s  %s\n' '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c' \
            "$install_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$install_dir/gitleaks.tar.gz" -C "$install_dir" gitleaks
          chmod +x "$install_dir/gitleaks"

      - name: Verify scanner history and failure contracts
        env:
          GITLEAKS_TEST_BINARY: ${{ runner.temp }}/gitleaks/gitleaks
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts/verify -p test_secret_scan.py -v

      - name: Scan complete event history
        run: python3 scripts/verify/secret_scan.py --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
