name: evidence authorization regressions

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/evidence-regressions.yml"
  push:
    branches: [main, "ops/**", "codex/**"]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/evidence-regressions.yml"

permissions:
  contents: read

concurrency:
  group: evidence-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Exercise actual RPC SQL with populated isolated fixtures
        run: npm test
