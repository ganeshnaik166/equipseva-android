name: backend regressions

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/cron-tick/**"
      - "scripts/cron_response_summary.py"
      - "scripts/test_cron_response_summary.py"
      - ".github/workflows/cron-tick-daily.yml"
      - "supabase/tests/**"
      - ".github/workflows/evidence-regressions.yml"
  push:
    branches: [main, "ops/**", "codex/**"]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/cron-tick/**"
      - "scripts/cron_response_summary.py"
      - "scripts/test_cron_response_summary.py"
      - ".github/workflows/cron-tick-daily.yml"
      - "supabase/tests/**"
      - ".github/workflows/evidence-regressions.yml"

permissions:
  contents: read

concurrency:
  group: evidence-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Exercise evidence RPC SQL, cron reporting and snapshot migration
        run: npm test
      - name: Exercise daily workflow response sanitization
        working-directory: .
        run: python3 scripts/test_cron_response_summary.py

  evidence-concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exercise evidence races with separate PostgreSQL sessions
        shell: bash
        run: |
          python3 supabase/tests/evidence_concurrency.py \
            --pg-bin "$(pg_config --bindir)" \
            --output-root "$RUNNER_TEMP/equipseva-evidence"
      - name: Preserve native evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-concurrency
          path: |
            ${{ runner.temp }}/equipseva-evidence/evidence-concurrency-*/evidence/*.json
            ${{ runner.temp }}/equipseva-evidence/evidence-concurrency-*/evidence/*.log
            ${{ runner.temp }}/equipseva-evidence/evidence-concurrency-*/evidence/*.sql
          if-no-files-found: warn
          retention-days: 14
