    /* page shell only: the HUD styles itself (src/styles/ui.css), the world draws into #webgl */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d0c; color: #fff; overscroll-behavior: none; }

    /* Boot shell: the first frame of the HUD loader (.esu-loader in ui.css: backdrop, orbit lines,
       progress track and counter) painted before the script bundle arrives. src/main.js removes it
       the moment the HUD attaches its own loader in the same place. */

    #boot svg { position: absolute; left: 50%; top: 50%; width: 145vmax; height: 145vmax; transform: translate(-50%, -50%); }
