# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
# android.defaults.buildfeatures.buildconfig was REMOVED entirely in AGP
# 9.0 (hard error, not just deprecated) — removed here since app/
# build.gradle.kts already explicitly sets buildFeatures { buildConfig =
# true } at the module level, so nothing was actually relying on this
# global default.

# AGP 9.0 migration (r#### AGP 8.13.2 -> 9.1.1 bump): opt out of the two
# biggest structural changes for now to keep this bump's blast radius
# contained to the version numbers themselves. Both flags are officially
# documented, temporary opt-outs (removed in AGP 10.0, mid-2026) — a
# follow-up task should migrate off them deliberately, not as a side effect
# of an unrelated dependency bump.
#   android.newDsl=false      — keeps the pre-9.0 variant API surface
#                                (this project doesn't use the removed
#                                variantFilter/applicationVariants APIs,
#                                but the flag is cheap insurance).
#   android.builtInKotlin=false — keeps the explicit
#                                org.jetbrains.kotlin.android plugin
#                                (AGP 9.0's built-in-Kotlin default is
#                                incompatible with that plugin).
android.newDsl=false
android.builtInKotlin=false

# Anti-tamper: R8 full-mode runs more aggressive optimization + tree-shaking
# on release, raising the cost of jadx / ghidra static analysis.
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP
ksp.incremental=false

# APK size budget (MB). Used by `./gradlew :app:checkApkSize` to fail the
# build if the release APK exceeds this floor. Bump only when a genuinely
# larger build is acceptable; investigate with `./gradlew :app:analyze`
# first. Current release APK is ~23 MB; 28 leaves ~5 MB headroom.
apkSizeBudgetMb=28
