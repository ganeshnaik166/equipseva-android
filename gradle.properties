# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Anti-tamper: R8 full-mode runs more aggressive optimization + tree-shaking
# on release, raising the cost of jadx / ghidra static analysis.
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP
ksp.incremental=false

# Lint: use the stable PSI-based UAST engine, not K2/FIR. AGP 8.13's K2 UAST
# lint engine intermittently crashes during analysis with
# "Error while resolving ... from RAW_FIR to COMPILER_REQUIRED_ANNOTATIONS"
# (a known lint/Kotlin-FIR bug) — it flaked on lintAnalyzeDebugAndroidTest and
# only passed on rerun. Forcing the stable engine makes :app:lintDebug
# deterministic. Revert once the K2 UAST lint bug is fixed upstream.
android.lint.useK2Uast=false

# APK size budget (MB). Used by `./gradlew :app:checkApkSize` to fail the
# build if the release APK exceeds this floor. Bump only when a genuinely
# larger build is acceptable; investigate with `./gradlew :app:analyze`
# first. Current release APK is ~23 MB; 28 leaves ~5 MB headroom.
apkSizeBudgetMb=28
